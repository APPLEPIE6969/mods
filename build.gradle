plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.drugsmod'
archivesBaseName = 'drugsmod'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net' }
}

dependencies {
    // Add Forge dependencies manually
    implementation 'org.jetbrains:annotations:20.1.0'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "drugsmod",
            "Specification-Vendor": "examplemod",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor" :"examplemod",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    
    // Include compiled classes and resources
    from sourceSets.main.output
    from('src/main/resources')
}
